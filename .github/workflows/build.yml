name: Build and Release FFmpeg Static

on:
  push:
    branches: ["main", "master"]

  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release and upload asset"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get commit info
        id: commit
        shell: bash
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)
      
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            yasm \
            nasm \
            pkg-config \
            meson \
            ninja-build \
            cmake \
            libwavpack-dev \
            libbz2-dev \
            zlib1g-dev \
            libx264-dev \
            libvpx-dev \
            libopus-dev
          pip install --upgrade meson

      - name: Build
        id: build-ffmpeg
        run: bash scripts/build-ffmpeg.sh

      - name: Verify
        run: |
          ~/ffmpeg-custom/bin/ffmpeg -version
          ~/ffmpeg-custom/bin/ffmpeg -h encoder=aac
          ~/ffmpeg-custom/bin/ffmpeg -filters | grep -i soxr || true
          file ~/ffmpeg-custom/bin/ffmpeg
          ldd ~/ffmpeg-custom/bin/ffmpeg || true

      - name: Archive
        run: |
          tar -czf ffmpeg-custom-linux-x86_64.tar.gz \
            -C "$HOME" \
            ffmpeg-custom

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-custom-static
          path: ffmpeg-custom-linux-x86_64.tar.gz

      - name: Release
        if: inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit.outputs.date }}-${{ steps.commit.outputs.commit }}
          name: FFmpeg Custom Build (${{ steps.build-ffmpeg.outputs.commit }})
          files: ffmpeg-custom-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
