name: Build and Release FFmpeg Static

on:
  push:
    branches: ["main", "master"]

  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release and upload asset"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git build-essential yasm nasm pkg-config \
            meson ninja-build cmake \
            libwavpack-dev libbz2-dev zlib1g-dev \
            libx264-dev libvpx-dev libopus-dev
          pip install --upgrade meson

      - name: Build FFmpeg
        id: build-ffmpeg
        run: bash scripts/build-ffmpeg.sh

      - name: Verify
        run: |
          ~/ffmpeg-custom/bin/ffmpeg -version
          ~/ffmpeg-custom/bin/ffmpeg -h encoder=aac

      - name: Archive
        run: |
          tar -czf ffmpeg-custom-linux-x86_64.tar.gz \
            -C "$HOME" ffmpeg-custom

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-custom-static
          path: ffmpeg-custom-linux-x86_64.tar.gz

      - name: Release
        if: inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-${{ steps.build-ffmpeg.outputs.date }}-${{ steps.build-ffmpeg.outputs.commit }}
          name: FFmpeg Custom Build (${{ steps.build-ffmpeg.outputs.commit }})
          body: |
            Automated static build of FFmpeg (`aac_improv2` branch).

            - Commit: `${{ steps.build-ffmpeg.outputs.commit }}`
            - Date: `${{ steps.build-ffmpeg.outputs.date }}`
            - Libraries: x264, vpx, opus, dav1d, soxr
          files: ffmpeg-custom-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
